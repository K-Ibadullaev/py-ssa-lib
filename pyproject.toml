[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ssa-lib"
version = "2.0.1"
description = "SSA and MSSA for time-series decomposition, forecasting, and signal-root estimation."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Konstantin Ibadullaev", email = "konstantin.ibadullaev.post@gmail.com" }
]
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/K-Ibadullaev/py-ssa-lib"
Repository = "https://github.com/K-Ibadullaev/py-ssa-lib"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tox>=4",
    "build>=1",
    "twine>=5",
    "sphinx>=8",
    "furo",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.coverage.run]
source = ["py_ssa_lib"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310
isolated_build = true

[testenv]
extras = test
commands =
    python -m pytest
"""

